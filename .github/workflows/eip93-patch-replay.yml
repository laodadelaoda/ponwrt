name: EIP93 GNU patch replay

on:
  push:
    branches:
      - eip93-minimal-audit
      - eip93-prebuild-audit-fixes
    paths:
      - 'target/linux/generic/hack-6.18/*eip93*.patch'
      - '.github/workflows/eip93-patch-replay.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    name: Linux 6.18.60 zero-fuzz replay
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PonWrt patch stack
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: ponwrt

      - name: Checkout exact Linux kernel baseline
        uses: actions/checkout@v5
        with:
          repository: gregkh/linux
          ref: v6.18.60
          path: linux
          fetch-depth: 1
          sparse-checkout: |
            drivers/crypto/inside-secure/eip93
          sparse-checkout-cone-mode: true

      - name: Verify GNU patch and replay EIP93 series
        shell: bash
        run: |
          set -euo pipefail
          patch --version | head -n 1 | grep -q 'GNU patch'
          test "$(git -C linux describe --tags --exact-match HEAD)" = "v6.18.60"
          mkdir -p replay-report
          {
            echo "kernel_tag=$(git -C linux describe --tags --exact-match HEAD)"
            echo "kernel_commit=$(git -C linux rev-parse HEAD)"
            echo "patch_version=$(patch --version | head -n 1)"
            echo "ponwrt_commit=$(git -C ponwrt rev-parse HEAD)"
            echo "common_blob=$(git -C linux rev-parse HEAD:drivers/crypto/inside-secure/eip93/eip93-common.c)"
          } | tee replay-report/environment.txt
          {
            echo "--- common.c lines 570-590 ---"
            sed -n '570,590l' linux/drivers/crypto/inside-secure/eip93/eip93-common.c
            echo "--- common.c lines 698-714 ---"
            sed -n '698,714l' linux/drivers/crypto/inside-secure/eip93/eip93-common.c
          } | tee replay-report/common-source.txt
          patches=(
            927-crypto-eip93-per-request-sa-record.patch
            928-crypto-eip93-dma-state-and-idr-fix.patch
            929-crypto-eip93-enforce-32bit-dma-mask.patch
            930-crypto-eip93-unwind-sg-copies-on-sync-failure.patch
            931-crypto-eip93-unwind-request-idr-and-state-dma.patch
            932-crypto-eip93-map-sa-state-bidirectionally.patch
            933-crypto-eip93-guard-hash-dma-cleanup.patch
            934-crypto-eip93-check-request-id-and-result-order.patch
            935-crypto-eip93-reject-hmac-before-setkey.patch
            935a-crypto-eip93-atomic-paired-ring-advance.patch
            935b-crypto-eip93-copy-result-before-ring-release.patch
            936-crypto-eip93-transactional-hash-staging.patch
            937-crypto-eip93-validate-imported-hash-state.patch
            938-crypto-eip93-check-hash-length-overflow-before-staging.patch
            939-crypto-eip93-respect-hash-request-sleepability.patch
            941-crypto-eip93-encode-aead-aad-offset.patch
            942-crypto-eip93-reject-zero-length-hash-final.patch
          )

          : > replay-report/replay.log
          for name in "${patches[@]}"; do
            file="ponwrt/target/linux/generic/hack-6.18/$name"
            if [[ "$name" == "933-crypto-eip93-guard-hash-dma-cleanup.patch" ]]; then
              mkdir -p replay-report/pre-933
              cp -a linux/drivers/crypto/inside-secure/eip93/. replay-report/pre-933/
              cp "$file" replay-report/933.patch
            fi
            if [[ "$name" == "935-crypto-eip93-reject-hmac-before-setkey.patch" ]]; then
              mkdir -p replay-report/pre-935
              cp linux/drivers/crypto/inside-secure/eip93/eip93-hash.c replay-report/pre-935/
              cp linux/drivers/crypto/inside-secure/eip93/eip93-hash.h replay-report/pre-935/
              cp "$file" replay-report/935.patch
            fi
            if [[ "$name" == "935a-crypto-eip93-atomic-paired-ring-advance.patch" ]]; then
              mkdir -p replay-report/pre-935a
              for source in eip93-common.c eip93-main.c eip93-main.h eip93-hash.c; do
                cp "linux/drivers/crypto/inside-secure/eip93/$source" replay-report/pre-935a/
              done
              cp "$file" replay-report/935a.patch
            fi
            if [[ "$name" == "935b-crypto-eip93-copy-result-before-ring-release.patch" ]]; then
              mkdir -p replay-report/pre-935b
              cp linux/drivers/crypto/inside-secure/eip93/eip93-common.c replay-report/pre-935b/
              cp linux/drivers/crypto/inside-secure/eip93/eip93-main.c replay-report/pre-935b/
              cp "$file" replay-report/935b.patch
            fi
            if [[ "$name" == "936-crypto-eip93-transactional-hash-staging.patch" ]]; then
              mkdir -p replay-report/pre-936
              for source in eip93-common.c eip93-common.h eip93-hash.c eip93-hash.h; do
                cp "linux/drivers/crypto/inside-secure/eip93/$source" replay-report/pre-936/
              done
              cp "$file" replay-report/936.patch
            fi
            if [[ "$name" == "937-crypto-eip93-validate-imported-hash-state.patch" ]]; then
              mkdir -p replay-report/pre-937
              cp linux/drivers/crypto/inside-secure/eip93/eip93-hash.c replay-report/pre-937/
              cp "$file" replay-report/937.patch
            fi
            if [[ "$name" == "938-crypto-eip93-check-hash-length-overflow-before-staging.patch" ]]; then
              mkdir -p replay-report/pre-938
              cp linux/drivers/crypto/inside-secure/eip93/eip93-hash.c replay-report/pre-938/
              cp "$file" replay-report/938.patch
            fi
            if [[ "$name" == "939-crypto-eip93-respect-hash-request-sleepability.patch" ]]; then
              mkdir -p replay-report/pre-939
              cp linux/drivers/crypto/inside-secure/eip93/eip93-hash.c replay-report/pre-939/
              cp linux/drivers/crypto/inside-secure/eip93/eip93-common.c replay-report/pre-939/
              cp "$file" replay-report/939.patch
            fi
            if [[ "$name" == "941-crypto-eip93-encode-aead-aad-offset.patch" ]]; then
              mkdir -p replay-report/pre-941
              cp linux/drivers/crypto/inside-secure/eip93/eip93-aead.c replay-report/pre-941/
              cp "$file" replay-report/941.patch
            fi
            if [[ "$name" == "942-crypto-eip93-reject-zero-length-hash-final.patch" ]]; then
              mkdir -p replay-report/pre-942
              cp linux/drivers/crypto/inside-secure/eip93/eip93-hash.c replay-report/pre-942/
              cp "$file" replay-report/942.patch
            fi
            echo "=== $name ===" | tee -a replay-report/replay.log
            sha256sum "$file" | tee -a replay-report/replay.log
            if ! output="$(patch --verbose --batch --forward --fuzz=0 -p1 -d linux < "$file" 2>&1)"; then
              printf '%s\n' "$output" | tee -a replay-report/replay.log
              echo "FAIL: GNU patch rejected $name" | tee -a replay-report/replay.log
              exit 1
            fi
            printf '%s\n' "$output" | tee -a replay-report/replay.log
            if printf '%s\n' "$output" | grep -Eiq '\(offset -?[1-9][0-9]* lines?\)|with fuzz [1-9][0-9]*|Hunk #[0-9]+ FAILED|out of [0-9]+ hunks FAILED|malformed patch|reversed patch|skipping patch|ignoring the trailing garbage|trailing garbage'; then
              echo "FAIL: non-zero offset/fuzz or rejected hunk in $name" | tee -a replay-report/replay.log
              exit 1
            fi
            if find linux -type f -name '*.rej' -print -quit | grep -q .; then
              echo "FAIL: GNU patch left a reject file after $name" | tee -a replay-report/replay.log
              exit 1
            fi
            echo "PASS: $name" | tee -a replay-report/replay.log
          done

          git -C linux diff --check
          echo "RESULT=PASS (927-939,941-942, GNU patch, zero fuzz/offset/reject)" | tee -a replay-report/replay.log
          git -C linux diff --stat | tee -a replay-report/replay.log
      - name: Upload replay evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: eip93-gnu-patch-replay
          path: |
            replay-report/environment.txt
            replay-report/replay.log
            replay-report/common-source.txt
            linux/drivers/crypto/inside-secure/eip93/eip93-common.c
            linux/drivers/crypto/inside-secure/eip93/eip93-common.h
            linux/drivers/crypto/inside-secure/eip93/eip93-main.c
            linux/drivers/crypto/inside-secure/eip93/eip93-hash.c
            linux/drivers/crypto/inside-secure/eip93/eip93-hash.h
            linux/drivers/crypto/inside-secure/eip93/eip93-aead.c
            linux/drivers/crypto/inside-secure/eip93/*.rej
            replay-report/pre-933/**
            replay-report/933.patch
            replay-report/pre-935/**
            replay-report/935.patch
            replay-report/pre-935a/**
            replay-report/935a.patch
            replay-report/pre-935b/**
            replay-report/935b.patch
            replay-report/pre-936/**
            replay-report/936.patch
            replay-report/pre-937/**
            replay-report/937.patch
            replay-report/pre-938/**
            replay-report/938.patch
            replay-report/pre-939/**
            replay-report/939.patch
            replay-report/pre-941/**
            replay-report/941.patch
            replay-report/pre-942/**
            replay-report/942.patch
          if-no-files-found: error
