name: EIP93 Linux 6.18.60 build validation

on:
  push:
    branches:
      - eip93-zero-fuzz-fix
    paths:
      - .github/workflows/eip93-build-validation.yml
      - target/linux/generic/hack-6.18/*eip93*.patch
      - target/linux/generic/kernel-6.18
      - target/linux/airoha/Makefile
      - target/linux/airoha/an7581/config-6.18
      - configs/an7581.config
      - configs/release.config
      - package/kernel/linux/modules/crypto.mk
      - include/kernel.mk
      - include/kernel-build.mk
      - include/kernel-defaults.mk
      - include/kernel-version.mk
      - target/linux/Makefile
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eip93-build-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: AN7581 EIP93 module compile and link
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout exact PonWrt revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Install OpenWrt build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk \
            gettext git g++-multilib gcc-multilib gperf help2man intltool \
            libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev lld llvm ninja-build p7zip-full patch pkgconf \
            python3 python3-docutils python3-pip python3-ply python3-pyelftools \
            qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs unzip wget xmlto xxd zlib1g-dev zstd

      - name: Pin feeds and derive Nokia XG-040G-MD configuration
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          grep -qx 'LINUX_VERSION-6.18 = 60' <(grep '^LINUX_VERSION-6.18 = ' target/linux/generic/kernel-6.18)
          grep -qx 'LINUX_KERNEL_HASH-6.18.60 = 3c2f44ef6acc021a7ad444d9a2e6ec1ef488ff09368793d0004a6080f69d621e' <(grep '^LINUX_KERNEL_HASH-6.18.60 = ' target/linux/generic/kernel-6.18)

          ./scripts/feeds update -a
          check_feed() {
            local name="$1" url="$2" sha="$3"
            test -d "feeds/$name/.git"
            test "$(git -C "feeds/$name" remote get-url origin)" = "$url"
            test "$(git -C "feeds/$name" rev-parse HEAD)" = "$sha"
          }
          check_feed pon_drivers https://github.com/laodadelaoda/openwrt-pon-drivers.git e4a43262a7dbf9abe269e5661e81dc302a37d822
          check_feed pon_userspace https://github.com/laodadelaoda/openwrt-pon-userspace.git a903fcc80f4b89f9b9e59a02d3ba1fc5550819a5
          ./scripts/feeds install -a

          selected='CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_nokia_xg-040g-md-ubi'
          tmp_cfg="$(mktemp)"
          trap 'rm -f "$tmp_cfg"' EXIT
          awk -v selected="$selected" '
            /^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_.*=y$/ {
              if ($0 == selected "=y") print
              else { sub(/^CONFIG_/, "# CONFIG_"); sub(/=y$/, " is not set"); print }
              next
            }
            { print }
          ' configs/an7581.config > "$tmp_cfg"
          grep -qx "${selected}=y" "$tmp_cfg"
          ./scripts/kconfig.pl + "$tmp_cfg" configs/release.config > .config
          make defconfig
          grep -qx 'CONFIG_TARGET_airoha=y' .config
          grep -qx 'CONFIG_TARGET_airoha_an7581=y' .config
          grep -qx "${selected}=y" .config
          grep -qx 'CONFIG_PACKAGE_kmod-crypto-hw-eip93=m' .config
          grep -qx 'CONFIG_CRYPTO_DEV_EIP93=m' target/linux/airoha/an7581/config-6.18
          grep -qx 'CONFIG_CRYPTO_USER_API_AEAD=y' target/linux/airoha/an7581/config-6.18

      - name: Prepare exact Linux 6.18.60 source with native patch sequence
        shell: bash
        run: |
          set -euo pipefail
          make target/linux/prepare V=s 2>&1 | tee prepare.log
          python3 - <<'PY'
          import re
          from pathlib import Path
          expected = [
            "927-crypto-eip93-per-request-sa-record.patch",
            "928-crypto-eip93-dma-state-and-idr-fix.patch",
            "929-crypto-eip93-enforce-32bit-dma-mask.patch",
            "930-crypto-eip93-unwind-sg-copies-on-sync-failure.patch",
            "931-crypto-eip93-unwind-request-idr-and-state-dma.patch",
            "932-crypto-eip93-map-sa-state-bidirectionally.patch",
            "933-crypto-eip93-guard-hash-dma-cleanup.patch",
            "935-crypto-eip93-reject-hmac-before-setkey.patch",
            "935a-crypto-eip93-atomic-paired-ring-advance.patch",
            "935b-crypto-eip93-copy-result-before-ring-release.patch",
            "936-crypto-eip93-transactional-hash-staging.patch",
            "937-crypto-eip93-validate-imported-hash-state.patch",
            "938-crypto-eip93-check-hash-length-overflow-before-staging.patch",
            "939-crypto-eip93-respect-hash-request-sleepability.patch",
            "941-crypto-eip93-encode-aead-aad-offset.patch",
            "942-crypto-eip93-reject-zero-length-hash-final.patch",
          ]
          log = Path("prepare.log").read_text(errors="replace").splitlines()
          sections, order, active = {}, [], None
          rx = re.compile(r"^Applying .*?/([^/]+\.patch)(?:\\s|$)")
          for line in log:
            m = rx.search(line)
            if m:
              active = m.group(1) if m.group(1) in expected else None
              if active:
                order.append(active)
                sections.setdefault(active, []).append(line)
            elif active:
              sections[active].append(line)
          if order != expected:
            raise SystemExit(f"EIP93 patch order/count mismatch: {order}")
          bad = re.compile(r"with fuzz|offset\\s+-?\\d+\\s+lines?|FAILED|malformed patch|Reversed \\(or previously applied\\)", re.I)
          for name in expected:
            body = sections.get(name, [])
            if not any("patching file " in x for x in body):
              raise SystemExit(f"{name}: no patch application confirmation")
            if any(bad.search(x) for x in body):
              raise SystemExit(f"{name}: non-exact patch application")
          print("PASS: all 16 EIP93 patches replayed in exact order without fuzz/offset/reject.")
          PY

      - name: Compile and link the full AN7581 kernel and modules
        shell: bash
        run: |
          set -euo pipefail
          make target/linux/compile V=s 2>&1 | tee kernel-compile.log
          make package/kernel/linux/compile V=s 2>&1 | tee kernel-packages-compile.log

      - name: Verify EIP93 module, symbols, ABI and package output
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t modules < <(find build_dir -type f -path '*/drivers/crypto/inside-secure/eip93/crypto-hw-eip93.ko' -print)
          test "${#modules[@]}" -eq 1
          module="${modules[0]}"
          file "$module" | tee module-file.txt
          readelf -h "$module" | tee module-elf-header.txt
          readelf -h "$module" | grep -q 'AArch64'
          strings "$module" | grep -q 'eip93'
          find bin -type f \( -name 'kmod-crypto-hw-eip93*.apk' -o -name 'kmod-crypto-hw-eip93*.ipk' \) -print | tee eip93-package-files.txt
          test -s eip93-package-files.txt
          sha256sum "$module" | tee eip93-module.sha256
          {
            echo "PonWrt commit: $GITHUB_SHA"
            echo "Kernel: Linux 6.18.60"
            echo "Target: Airoha AN7581 / Nokia XG-040G-MD UBI"
            echo "EIP93 module: $module"
            echo "Module architecture: AArch64"
            echo "Compile/link: PASS"
            echo "Crypto API runtime tests: NOT RUN (GitHub runner has no EIP93 hardware)"
            echo "Hardware validation: NOT RUN"
          } | tee eip93-build-report.txt

      - name: Preserve build logs and module artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: eip93-build-validation-${{ github.sha }}
          path: |
            prepare.log
            kernel-compile.log
            kernel-packages-compile.log
            module-file.txt
            module-elf-header.txt
            eip93-package-files.txt
            eip93-module.sha256
            eip93-build-report.txt
            build_dir/target-*/linux-*/linux-6.18.60/drivers/crypto/inside-secure/eip93/crypto-hw-eip93.ko
            bin/targets/airoha/an7581/packages/*kmod-crypto-hw-eip93*
          if-no-files-found: warn
          retention-days: 30
