name: Validate upstream candidate after Full

on:
  push:
    branches:
      - epon1g-nokia-xg-040g-md
    paths:
      - .github/workflows/upstream-merge-after-full.yml
  workflow_run:
    workflows:
      - Build Nokia XG-040G-MD UBI (AN7581)
    types:
      - completed

permissions:
  pull-requests: write
  actions: write

concurrency:
  group: upstream-candidate-merge
  cancel-in-progress: false

jobs:
  refresh-stale-candidate:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - name: Refresh candidate and dispatch Full for its exact SHA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          base_branch="epon1g-nokia-xg-040g-md"
          workflow_file=".github/workflows/nokia-xg-040g-md-ubi.yml"
          current_base="$(gh api "repos/$GH_REPO/branches/$base_branch" --jq .commit.sha)"
          pr_json="$(gh pr list --repo "$GH_REPO" --state open --base "$base_branch" --json number,headRefName,headRefOid,createdAt)"
          candidate="$(jq -c '[.[] | select(.headRefName | startswith("upstream-candidate-"))] | sort_by(.createdAt) | last // empty' <<<"$pr_json")"
          if [ -z "$candidate" ]; then
            echo "No open upstream candidate PR; nothing to refresh."
            exit 0
          fi

          number="$(jq -r .number <<<"$candidate")"
          candidate_branch="$(jq -r .headRefName <<<"$candidate")"
          head_sha="$(jq -r .headRefOid <<<"$candidate")"
          merge_base="$(gh api "repos/$GH_REPO/compare/$base_branch...$head_sha" --jq .merge_base_commit.sha)"

          if [ "$current_base" != "$merge_base" ]; then
            echo "Refreshing PR #$number from $head_sha with current base $current_base."
            gh api --method PUT "repos/$GH_REPO/pulls/$number/update-branch" -f expected_head_sha="$head_sha"
            for attempt in $(seq 1 30); do
              candidate_json="$(gh pr view "$number" --repo "$GH_REPO" --json headRefOid)"
              new_head="$(jq -r .headRefOid <<<"$candidate_json")"
              new_merge_base="$(gh api "repos/$GH_REPO/compare/$base_branch...$new_head" --jq .merge_base_commit.sha)"
              if [ "$new_merge_base" = "$current_base" ] && [ "$new_head" != "$head_sha" ]; then
                head_sha="$new_head"
                echo "Candidate refreshed to $head_sha."
                break
              fi
              sleep 5
            done
            test "$new_merge_base" = "$current_base"
          fi

          runs="$(gh run list --repo "$GH_REPO" --workflow "$workflow_file" --branch "$candidate_branch" --limit 50 --json headSha,status,conclusion,event)"
          active="$(jq --arg sha "$head_sha" '[.[] | select(.headSha == $sha and (.status == "queued" or .status == "in_progress"))] | length' <<<"$runs")"
          successful="$(jq --arg sha "$head_sha" '[.[] | select(.headSha == $sha and .event == "workflow_dispatch" and .conclusion == "success")] | length' <<<"$runs")"
          if [ "$active" -eq 0 ] && [ "$successful" -eq 0 ]; then
            echo "Dispatching exactly one Full build for candidate SHA $head_sha."
            gh workflow run "$workflow_file" --repo "$GH_REPO" --ref "$candidate_branch"
          else
            echo "Full already active or successful for candidate SHA $head_sha; no duplicate dispatch."
          fi

  verify:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'upstream-candidate-')
    runs-on: ubuntu-24.04
    steps:
      - name: Verify exact successful Full run and report manual merge readiness
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          CANDIDATE_BRANCH: ${{ github.event.workflow_run.head_branch }}
          CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha }}
          FULL_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CANDIDATE_BRANCH"
          test -n "$CANDIDATE_SHA"

          pr_json="$(gh pr list --repo "$GH_REPO" --state open --head "$CANDIDATE_BRANCH" --json number,headRefOid,baseRefName)"
          number="$(jq -r --arg sha "$CANDIDATE_SHA" --arg base epon1g-nokia-xg-040g-md '.[] | select(.headRefOid == $sha and .baseRefName == $base) | .number' <<<"$pr_json" | head -n1)"
          if [ -z "$number" ]; then
            echo "No open candidate PR matches successful Full SHA $CANDIDATE_SHA; refusing merge."
            exit 1
          fi

          run_json="$(gh api "repos/$GH_REPO/actions/runs/$FULL_RUN_ID")"
          conclusion="$(jq -r '.conclusion' <<<"$run_json")"
          workflow_id="$(jq -r '.workflow_id' <<<"$run_json")"
          run_head="$(jq -r '.head_sha' <<<"$run_json")"
          run_branch="$(jq -r '.head_branch' <<<"$run_json")"
          run_event="$(jq -r '.event' <<<"$run_json")"
          test "$conclusion" = success
          test "$run_head" = "$CANDIDATE_SHA"
          test "$run_branch" = "$CANDIDATE_BRANCH"
          test "$run_event" = workflow_dispatch
          workflow_name="$(gh api "repos/$GH_REPO/actions/workflows/$workflow_id" --jq .name)"
          test "$workflow_name" = "Build Nokia XG-040G-MD UBI (AN7581)"

          current_base="$(gh api "repos/$GH_REPO/branches/epon1g-nokia-xg-040g-md" --jq .commit.sha)"
          merge_base="$(gh api "repos/$GH_REPO/compare/epon1g-nokia-xg-040g-md...$CANDIDATE_SHA" --jq .merge_base_commit.sha)"
          if [ "$current_base" != "$merge_base" ]; then
            echo "Candidate is stale; it must be refreshed and pass Full again."
            exit 1
          fi

          current_pr_head="$(gh pr view "$number" --repo "$GH_REPO" --json headRefOid --jq .headRefOid)"
          test "$current_pr_head" = "$CANDIDATE_SHA"
          echo "Exact Full SHA $CANDIDATE_SHA is current and validated."
          echo "PR #$number is ready for manual review and merge; no automatic merge is performed."
