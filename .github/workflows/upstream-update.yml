name: Upstream candidate evaluation

on:
  push:
    branches:
      - epon1g-nokia-xg-040g-md
    paths:
      - .github/workflows/upstream-update.yml
  schedule:
    - cron: "23 4 * * 1,4"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-candidate
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: epon1g-nokia-xg-040g-md
          fetch-depth: 0

      - name: Evaluate core upstream history and mergeability
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p upstream-report
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add immortalwrt https://github.com/immortalwrt/immortalwrt.git
          git remote add ponwrt-upstream https://github.com/pbs05/ponwrt.git
          git fetch --no-tags immortalwrt master
          git fetch --no-tags ponwrt-upstream master
          integrate() {
            ref="$1"; label="$2"
            base="$(git merge-base HEAD "$ref")" || { echo "HOLD: no merge base for $label"; return 1; }
            counts="$(git rev-list --left-right --count "HEAD...$ref")"
            local_only="$(awk '{print $1}' <<<"$counts")"
            upstream_only="$(awk '{print $2}' <<<"$counts")"
            echo "$label merge-base=$base local-only=$local_only upstream-only=$upstream_only" | tee -a upstream-report/history.txt
            git log --reverse --format='%H %s' "HEAD..$ref" > "upstream-report/$label-upstream-commits.txt"
            git diff --stat "HEAD...$ref" > "upstream-report/$label-diffstat.txt"
            if [ "$upstream_only" -eq 0 ]; then return 0; fi
            # The merge itself is the authoritative conflict check.
            git merge --no-ff --no-edit "$ref" -m "upstream: integrate $label"
          }
          integrate immortalwrt/master ImmortalWrt
          integrate ponwrt-upstream/master PonWrt

      - name: Audit PON fork ancestry and preserve BOSA A0/A2 behavior
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p upstream-report
          audit() {
            name="$1"; fork="$2"; upstream="$3"; protected="$4"
            dir="$RUNNER_TEMP/$name"
            git clone --quiet "$fork" "$dir"
            git -C "$dir" remote add upstream "$upstream"
            git -C "$dir" fetch --quiet upstream main
            f="$(git -C "$dir" rev-parse origin/main)"
            u="$(git -C "$dir" rev-parse upstream/main)"
            base="$(git -C "$dir" merge-base "$f" "$u")" || { echo "HOLD: $name has no common ancestor"; return 1; }
            read -r ahead behind < <(git -C "$dir" rev-list --left-right --count "$f...$u")
            echo "$name fork=$f upstream=$u merge-base=$base fork-only=$ahead upstream-only=$behind" | tee -a upstream-report/feeds.txt
            git -C "$dir" diff --stat "$base..$f" > "upstream-report/$name-fork-diffstat.txt"
            git -C "$dir" diff --stat "$base..$u" > "upstream-report/$name-upstream-diffstat.txt"
            if [ "$protected" = bosa ]; then
              git -C "$dir" diff "$base..$f" -- airoha-pon-frontends/src/airoha-en7572.c > upstream-report/bosa-a0-a2-fork.diff
              git -C "$dir" diff "$base..$u" -- airoha-pon-frontends/src/airoha-en7572.c > upstream-report/bosa-a0-a2-upstream.diff
            fi
            if [ "$protected" = bosa ]; then
              src="$(git -C "$dir" show "$f:airoha-pon-frontends/src/airoha-en7572.c")"
              for marker in selected_bob_base bob_a0_valid bob_a2_valid en7572_bob_base; do
                grep -q "$marker" <<<"$src" || { echo "HOLD: missing protected BOSA marker $marker"; return 1; }
              done
              if [ "$behind" -gt 0 ]; then
                echo "HOLD: Drivers upstream has $behind unintegrated commit(s); retain current fork pin pending A0/A2 behavioral equivalence review."
                echo "$name=HOLD" >> upstream-report/feed-revisions.env
                return 0
              fi
            elif [ "$behind" -gt 0 ]; then
              echo "HOLD: Userspace upstream has $behind unintegrated commit(s); retain current fork pin."
              echo "$name=HOLD" >> upstream-report/feed-revisions.env
              return 0
            fi
            echo "$name=$f" >> upstream-report/feed-revisions.env
          }
          : > upstream-report/feed-revisions.env
          audit pon_drivers https://github.com/laodadelaoda/openwrt-pon-drivers.git https://github.com/pbs05/openwrt-pon-drivers.git bosa
          audit pon_userspace https://github.com/laodadelaoda/openwrt-pon-userspace.git https://github.com/pbs05/openwrt-pon-userspace.git none
          driver="$(sed -n 's/^pon_drivers=//p' upstream-report/feed-revisions.env)"
          userspace="$(sed -n 's/^pon_userspace=//p' upstream-report/feed-revisions.env)"
          if [ -n "$driver" ] && [ "$driver" != HOLD ]; then
            sed -i -E "s#^(src-git pon_drivers https://github.com/laodadelaoda/openwrt-pon-drivers.git)\^[0-9a-f]{40}#\1^$driver#" feeds.conf.default
          fi
          if [ -n "$userspace" ] && [ "$userspace" != HOLD ]; then
            sed -i -E "s#^(src-git pon_userspace https://github.com/laodadelaoda/openwrt-pon-userspace.git)\^[0-9a-f]{40}#\1^$userspace#" feeds.conf.default
          fi
          grep '^src-git pon_drivers ' feeds.conf.default
          grep '^src-git pon_userspace ' feeds.conf.default

      - name: Generate deterministic source lock
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import re
          import subprocess
          from pathlib import Path

          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()

          def repo_git(path, *args):
              return subprocess.check_output(["git", "-C", path, *args], text=True).strip()

          def feed_pin(name):
              for line in Path("feeds.conf.default").read_text().splitlines():
                  fields = line.split()
                  if len(fields) >= 3 and fields[0] == "src-git" and fields[1] == name:
                      spec = fields[2]
                      if "^" not in spec:
                          raise SystemExit(f"{name}: feed is not pinned to an exact commit")
                      url, commit = spec.rsplit("^", 1)
                      if not re.fullmatch(r"[0-9a-f]{40}", commit):
                          raise SystemExit(f"{name}: invalid pinned commit {commit}")
                      return {"url": url, "commit": commit}
              raise SystemExit(f"Missing feed {name}")

          patch_hash = hashlib.sha256()
          patch_names = subprocess.check_output(
              ["git", "ls-files", "-z", "--", "*.patch"]
          ).split(b"\0")
          for name in sorted(x for x in patch_names if x):
              patch_hash.update(name)
              patch_hash.update(b"\0")
              patch_hash.update(hashlib.sha256(Path(name.decode()).read_bytes()).digest())

          # The audit step clones these repositories under RUNNER_TEMP.
          import os
          drivers = Path(os.environ["RUNNER_TEMP"]) / "pon_drivers"
          userspace = Path(os.environ["RUNNER_TEMP"]) / "pon_userspace"

          lock = {
              "schema": 1,
              "sources": {
                  "immortalwrt": {
                      "repository": "immortalwrt/immortalwrt",
                      "ref": "master",
                      "commit": git("rev-parse", "immortalwrt/master"),
                  },
                  "ponwrt": {
                      "repository": "pbs05/ponwrt",
                      "ref": "master",
                      "commit": git("rev-parse", "ponwrt-upstream/master"),
                  },
                  "pon_drivers": {
                      "upstream_repository": "pbs05/openwrt-pon-drivers",
                      "upstream_ref": "main",
                      "upstream_commit": repo_git(str(drivers), "rev-parse", "upstream/main"),
                      "fork_repository": "laodadelaoda/openwrt-pon-drivers",
                      "fork_ref": "main",
                      "fork_commit": repo_git(str(drivers), "rev-parse", "origin/main"),
                      "feed": feed_pin("pon_drivers"),
                  },
                  "pon_userspace": {
                      "upstream_repository": "pbs05/openwrt-pon-userspace",
                      "upstream_ref": "main",
                      "upstream_commit": repo_git(str(userspace), "rev-parse", "upstream/main"),
                      "fork_repository": "laodadelaoda/openwrt-pon-userspace",
                      "fork_ref": "main",
                      "fork_commit": repo_git(str(userspace), "rev-parse", "origin/main"),
                      "feed": feed_pin("pon_userspace"),
                  },
              },
              "inputs": {
                  "feeds_conf_default_sha256": hashlib.sha256(
                      Path("feeds.conf.default").read_bytes()
                  ).hexdigest(),
                  "tracked_patch_inventory_sha256": patch_hash.hexdigest(),
              },
          }
          Path("ponwrt-source-lock.json").write_text(
              json.dumps(lock, indent=2, sort_keys=True) + "\n"
          )
          print("Generated ponwrt-source-lock.json")
          print("Tracked patch inventory SHA256:", patch_hash.hexdigest())
          PY

      - name: Create upstream candidate PR; Full remains an explicit action
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_PR_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          base_sha="$(git rev-parse refs/remotes/origin/epon1g-nokia-xg-040g-md)"
          git add -u
          git add feeds.conf.default ponwrt-source-lock.json
          if [ "$(git rev-parse HEAD)" = "$base_sha" ] && git diff --cached --quiet; then
            echo "No compatible upstream updates."
            exit 0
          fi
          if ! git diff --cached --quiet; then
            git commit -m "upstream: update audited PON feed pins"
          fi
          branch="upstream-candidate-${{ github.run_id }}"
          candidate="$(git rev-parse HEAD)"
          git push origin "HEAD:refs/heads/$branch"
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::Candidate branch $branch was pushed, but UPSTREAM_PR_TOKEN is missing. Add a token with Contents and Pull requests write permissions to create the PR."
            exit 1
          fi
          gh pr create --base epon1g-nokia-xg-040g-md --head "$branch" \
            --title "upstream: audited compatible update" \
            --body "Candidate generated after upstream history and PON feed compatibility checks. ponwrt-source-lock.json pins all four upstream source revisions, both fork feed pins, feeds.conf.default, and the tracked patch inventory. It is merged only after Full succeeds on this exact head SHA."
          printf 'candidate=%s\nsha=%s\n' "$branch" "$candidate" > upstream-report/candidate.txt

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: upstream-audit-${{ github.run_id }}
          path: upstream-report/
          if-no-files-found: warn
          retention-days: 90
