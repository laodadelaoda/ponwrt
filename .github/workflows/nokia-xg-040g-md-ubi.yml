name: Build Nokia XG-040G-MD UBI (AN7581)
run-name: Nokia XG-040G-MD UBI build

on:
  push:
    branches:
      - epon1g-nokia-xg-040g-md
    paths:
      - .github/workflows/nokia-xg-040g-md-ubi.yml
      - configs/an7581.config
      - configs/release.config
      - feeds.conf.default
      - package/boot/arm-trusted-firmware-airoha/**
      - package/boot/uboot-airoha/**
      - package/kernel/**
      - include/kernel*.mk
      - scripts/feeds
      - target/linux/airoha/**
      - target/linux/generic/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nokia-xg-040g-md-ubi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: AN7581 / Nokia XG-040G-MD UBI
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout PonWrt
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Free build space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk \
            gettext git g++-multilib gcc-multilib gperf help2man intltool \
            libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev lld llvm ninja-build p7zip-full patch pkgconf \
            python3 python3-docutils python3-pip python3-ply python3-pyelftools \
            qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs unzip wget xmlto xxd zlib1g-dev zstd

      - name: Verify main source revision
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$GITHUB_SHA"
          echo "PonWrt source SHA: $actual" | tee source-revisions.txt

      - name: Update and install pinned feeds
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/feeds update -a

          check_feed() {
            local name="$1" expected_url="$2" expected_sha="$3"
            local actual_url actual_sha
            test -d "feeds/$name/.git"
            actual_url="$(git -C "feeds/$name" remote get-url origin)"
            actual_sha="$(git -C "feeds/$name" rev-parse HEAD)"
            test "$actual_url" = "$expected_url"
            test "$actual_sha" = "$expected_sha"
            printf '%s SHA: %s\n%s URL: %s\n' "$name" "$actual_sha" "$name" "$actual_url" | tee -a source-revisions.txt
          }

          check_feed pon_drivers https://github.com/laodadelaoda/openwrt-pon-drivers.git e4a43262a7dbf9abe269e5661e81dc302a37d822
          check_feed pon_userspace https://github.com/laodadelaoda/openwrt-pon-userspace.git a903fcc80f4b89f9b9e59a02d3ba1fc5550819a5

          ./scripts/feeds install -a

      - name: Derive a single-device configuration
        shell: bash
        run: |
          set -euo pipefail
          selected='CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_nokia_xg-040g-md-ubi'
          tmp_cfg="$(mktemp)"
          trap 'rm -f "$tmp_cfg"' EXIT

          awk -v selected="$selected" '
            /^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_.*=y$/ {
              if ($0 == selected "=y") {
                print
              } else {
                sub(/^CONFIG_/, "# CONFIG_")
                sub(/=y$/, " is not set")
                print
              }
              next
            }
            { print }
          ' configs/an7581.config > "$tmp_cfg"

          grep -qx "${selected}=y" "$tmp_cfg"
          active_before="$(grep -E '^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_.*=y$' "$tmp_cfg" || true)"
          test "$active_before" = "${selected}=y"

          ./scripts/kconfig.pl + "$tmp_cfg" configs/release.config > .config
          make defconfig

          grep -qx 'CONFIG_TARGET_airoha=y' .config
          grep -qx 'CONFIG_TARGET_airoha_an7581=y' .config
          grep -qx 'CONFIG_TARGET_MULTI_PROFILE=y' .config
          grep -qx 'CONFIG_TARGET_PER_DEVICE_ROOTFS=y' .config

          active_after="$(grep -E '^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_.*=y$' .config || true)"
          test "$active_after" = "${selected}=y"

          if grep -q '^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_nokia_xg-040g-md-ubi-usb-sfp=y$' .config; then
            echo 'Unexpected USB-SFP device profile enabled' >&2
            exit 1
          fi

          {
            echo 'Selected target: airoha/an7581'
            echo 'Selected device: nokia_xg-040g-md-ubi'
            echo 'Expected DTS: an7581-nokia_xg-040g-md-ubi'
            echo 'Expected primary image: sysupgrade.itb'
            echo 'Active AN7581 device selectors:'
            printf '%s\n' "$active_after"
          } | tee single-device-config-check.txt

      - name: Download sources
        shell: bash
        run: |
          set -o pipefail
          make download -j"$(nproc)" 2>&1 | tee download.log

      - name: Build Nokia XG-040G-MD Bootloader packages
        shell: bash
        run: |
          set -euo pipefail

          grep -qx 'CONFIG_PACKAGE_trusted-firmware-a-an7581-bl2=y' .config
          grep -qx 'CONFIG_PACKAGE_trusted-firmware-a-an7581-bl31=y' .config
          grep -qx 'CONFIG_PACKAGE_u-boot-an7581_nokia_xg-040g-md=y' .config

          make package/boot/arm-trusted-firmware-airoha/compile -j"$(nproc)" V=s 2>&1 | tee atf-build.log
          make package/boot/uboot-airoha/compile -j"$(nproc)" V=s 2>&1 | tee bootloader-build.log

          find_staged_one() {
            local name="$1"
            local -a matches=()
            mapfile -t matches < <(find staging_dir -type f -name "$name" -print)
            if [ "${#matches[@]}" -ne 1 ] || [ ! -s "${matches[0]:-}" ]; then
              printf 'Expected exactly one non-empty staged Bootloader input %s; found %s\n' "$name" "${#matches[@]}" >&2
              printf '%s\n' "${matches[@]}" >&2
              exit 1
            fi
            printf '%s\n' "${matches[0]}"
          }

          bl2="$(find_staged_one 'an7581-bl2.bin')"
          bl31="$(find_staged_one 'an7581-bl31.lzma')"
          uboot="$(find_staged_one 'an7581_nokia_xg-040g-md-u-boot.lzma')"
          uboot_dtb="$(find_staged_one 'an7581_nokia_xg-040g-md-u-boot.dtb')"

          {
            printf 'BL2: %s\n' "$bl2"
            printf 'BL31: %s\n' "$bl31"
            printf 'U-Boot: %s\n' "$uboot"
            printf 'U-Boot DTB: %s\n' "$uboot_dtb"
            sha256sum "$bl2" "$bl31" "$uboot" "$uboot_dtb"
          } | tee bootloader-inputs.txt

      - name: Build firmware and device Bootloader images
        shell: bash
        run: |
          set -o pipefail
          make -j"$(nproc)" V=s 2>&1 | tee build.log

      - name: Build required PonWrt kmods omitted from firmware
        shell: bash
        run: |
          set -euo pipefail

          # These modules are supplied by the pinned PonWrt PON driver feed.
          # They must never be substituted with ImmortalWrt prebuilt kmods.
          required_kmods=(
            kmod-airoha-en7572
            kmod-airoha-paged-bosa
            kmod-airoha-xpon
          )

          # Preserve the exact firmware build configuration. Select the required
          # packages as modules only for this supplementary package build.
          cp .config .config.firmware
          restore_config() {
            cp .config.firmware .config
          }
          trap restore_config EXIT

          for package in "${required_kmods[@]}"; do
            # Force module packaging, never rootfs selection, in this
            # supplementary pass regardless of firmware profile defaults.
            sed -i -e "/^CONFIG_PACKAGE_${package}=/d" \
              -e "/^# CONFIG_PACKAGE_${package} is not set$/d" .config
            printf 'CONFIG_PACKAGE_%s=m\n' "$package" >> .config
          done

          make defconfig

          for package in "${required_kmods[@]}"; do
            if ! grep -qx "CONFIG_PACKAGE_${package}=m" .config; then
              echo "Required supplementary kmod is not selected as a module: $package" >&2
              grep -E "^CONFIG_PACKAGE_${package}=" .config || true
              exit 1
            fi
          done

          {
            echo "PonWrt commit: ${GITHUB_SHA}"
            echo "Kernel: $(grep '^CONFIG_LINUX_6_' .config.firmware | head -n1 || true)"
            echo "Build mode: standalone kmod package pass; original firmware rootfs configuration preserved"
            printf 'Required packages: %s\n' "${required_kmods[*]}"
            sha256sum .config
          } | tee ponwrt-kmod-build-info.txt

          # Build from the same source tree, pinned feeds, toolchain and kernel
          # configuration used for the firmware. This also resolves package deps.
          make package/compile -j"$(nproc)" V=s 2>&1 | tee ponwrt-kmod-build.log

          mkdir -p output/kmods
          mapfile -t all_kmod_apks < <(find bin/packages -type f -name 'kmod-*.apk' -print | sort)
          if [ "${#all_kmod_apks[@]}" -eq 0 ]; then
            echo 'No PonWrt-built kmod APKs were produced' >&2
            exit 1
          fi

          # Keep the complete kmod set produced by this exact PonWrt build.
          # This preserves same-kernel dependencies alongside the PON modules.
          declare -A seen_kmod_files=()
          for apk in "${all_kmod_apks[@]}"; do
            name="$(basename "$apk")"
            if [[ -n "${seen_kmod_files[$name]:-}" ]]; then
              printf 'Duplicate kmod artifact filename: %s\n' "$name" >&2
              exit 1
            fi
            seen_kmod_files[$name]=1
            install -m 0644 "$apk" "output/kmods/$name"
          done

          for package in "${required_kmods[@]}"; do
            mapfile -t matches < <(find output/kmods -maxdepth 1 -type f -name "${package}_*.apk" -print)
            if [ "${#matches[@]}" -ne 1 ] || [ ! -s "${matches[0]:-}" ]; then
              printf 'Expected exactly one non-empty PonWrt-built APK for %s; found %s\n' "$package" "${#matches[@]}" >&2
              printf '%s\n' "${matches[@]}" >&2
              exit 1
            fi
          done

          (cd output/kmods && sha256sum ./*.apk > SHA256SUMS)
          printf 'PonWrt-built kmod APK count: %s\n' "${#all_kmod_apks[@]}" | tee -a ponwrt-kmod-build-info.txt

          {
            echo "Repository: ${GITHUB_REPOSITORY}"
            echo "Commit: ${GITHUB_SHA}"
            echo "Kernel config: $(grep '^CONFIG_LINUX_6_' .config.firmware | head -n1 || true)"
            echo
            echo "PonWrt-built kmod packages (including dependency kmods):"
            cat output/kmods/SHA256SUMS
          } > output/kmods/BUILD-INFO.txt

          restore_config
          trap - EXIT

      - name: Verify and stage firmware and Bootloader artifacts
        shell: bash
        run: |
          set -euo pipefail
          image_dir='bin/targets/airoha/an7581'
          test -d "$image_dir"

          find_one() {
            local pattern="$1" description="$2"
            local -a matches=()
            mapfile -t matches < <(find "$image_dir" -maxdepth 1 -type f -name "$pattern" -print)
            if [ "${#matches[@]}" -ne 1 ]; then
              printf 'Expected exactly one %s (%s), found %s\n' "$description" "$pattern" "${#matches[@]}" >&2
              printf '%s\n' "${matches[@]}" >&2
              exit 1
            fi
            if [ ! -s "${matches[0]}" ]; then
              printf '%s is missing or empty: %s\n' "$description" "${matches[0]}" >&2
              exit 1
            fi
            printf '%s\n' "${matches[0]}"
          }

          sysupgrade="$(find_one '*sysupgrade.itb' 'sysupgrade image')"
          fip="$(find_one 'bl31-uboot.fip' 'BL31/U-Boot FIP')"
          preloader="$(find_one 'preloader.bin' 'Preloader')"

          mkdir -p output
          install -m 0644 "$sysupgrade" output/nokia_xg-040g-md-ubi-sysupgrade.itb
          install -m 0644 "$fip" output/bl31-uboot.fip
          install -m 0644 "$preloader" output/preloader.bin

          for artifact in \
            output/nokia_xg-040g-md-ubi-sysupgrade.itb \
            output/bl31-uboot.fip \
            output/preloader.bin; do
            test -s "$artifact"
          done

          sha256sum \
            output/nokia_xg-040g-md-ubi-sysupgrade.itb \
            output/bl31-uboot.fip \
            output/preloader.bin > output/SHA256SUMS
          (cd output && sha256sum kmods/*.apk) >> output/SHA256SUMS

          {
            echo "Repository: ${GITHUB_REPOSITORY}"
            echo "Commit: ${GITHUB_SHA}"
            echo 'Target: airoha/an7581'
            echo 'Device: nokia_xg-040g-md-ubi'
            echo 'DTS: an7581-nokia_xg-040g-md-ubi'
            echo "Built at (UTC): $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo
            echo 'Source revisions:'
            cat source-revisions.txt
            echo
            echo 'Artifact SHA256:'
            cat output/SHA256SUMS
            echo
            echo 'Supplementary PonWrt kmods:'
            cat output/kmods/SHA256SUMS
          } > output/BUILD-INFO.txt

      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ponwrt-nokia-xg-040g-md-ubi-sysupgrade
          path: output/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ponwrt-nokia-xg-040g-md-ubi-build-diagnostics
          path: |
            source-revisions.txt
            single-device-config-check.txt
            download.log
            atf-build.log
            bootloader-build.log
            bootloader-inputs.txt
            ponwrt-kmod-build-info.txt
            ponwrt-kmod-build.log
            build.log
          if-no-files-found: ignore
          retention-days: 14
