name: Build Nokia XG-040G-MD UBI (AN7581)
run-name: Nokia XG-040G-MD UBI build

on:
  workflow_dispatch:

permissions:
  contents: read

# Manual Full builds are serialized; a second dispatch never cancels an active build.
concurrency:
  group: nokia-xg-040g-md-ubi
  cancel-in-progress: false

jobs:
  build:
    name: AN7581 / Nokia XG-040G-MD UBI
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout PonWrt
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Free build space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk \
            gettext git g++-multilib gcc-multilib gperf help2man intltool \
            libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev lld llvm ninja-build p7zip-full patch pkgconf \
            python3 python3-docutils python3-pip python3-ply python3-pyelftools \
            qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs unzip wget xmlto xxd zlib1g-dev zstd

      - name: Verify main source revision
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$GITHUB_SHA"
          echo "PonWrt source SHA: $actual" | tee source-revisions.txt

      - name: Update and install pinned feeds
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/feeds update -a

          check_feed() {
            local name="$1" expected_url="$2"
            local spec configured_url expected_sha actual_url actual_sha
            test -d "feeds/$name/.git"
            spec="$(awk -v name="$name" '$1 == "src-git" && $2 == name { print $3 }' feeds.conf.default)"
            test -n "$spec"
            configured_url="${spec%%^*}"
            expected_sha="${spec##*^}"
            [[ "$expected_sha" =~ ^[0-9a-f]{40}$ ]]
            test "$configured_url" = "$expected_url"
            actual_url="$(git -C "feeds/$name" remote get-url origin)"
            actual_sha="$(git -C "feeds/$name" rev-parse HEAD)"
            test "$actual_url" = "$expected_url"
            test "$actual_sha" = "$expected_sha"
            printf '%s SHA: %s\n%s URL: %s\n' "$name" "$actual_sha" "$name" "$actual_url" | tee -a source-revisions.txt
          }

          check_feed pon_drivers https://github.com/laodadelaoda/openwrt-pon-drivers.git
          check_feed pon_userspace https://github.com/laodadelaoda/openwrt-pon-userspace.git

          ./scripts/feeds install -a

      - name: Derive a single-device configuration
        shell: bash
        run: |
          set -euo pipefail
          selected='CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_nokia_xg-040g-md-ubi'
          tmp_cfg="$(mktemp)"
          trap 'rm -f "$tmp_cfg"' EXIT

          awk -v selected="$selected" '
            /^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_.*=y$/ {
              if ($0 == selected "=y") {
                print
              } else {
                sub(/^CONFIG_/, "# CONFIG_")
                sub(/=y$/, " is not set")
                print
              }
              next
            }
            { print }
          ' configs/an7581.config > "$tmp_cfg"

          grep -qx "${selected}=y" "$tmp_cfg"
          active_before="$(grep -E '^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_.*=y$' "$tmp_cfg" || true)"
          test "$active_before" = "${selected}=y"

          ./scripts/kconfig.pl + "$tmp_cfg" configs/release.config > .config
          make defconfig

          grep -qx 'CONFIG_TARGET_airoha=y' .config
          grep -qx 'CONFIG_TARGET_airoha_an7581=y' .config
          grep -qx 'CONFIG_TARGET_MULTI_PROFILE=y' .config
          grep -qx 'CONFIG_TARGET_PER_DEVICE_ROOTFS=y' .config

          active_after="$(grep -E '^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_.*=y$' .config || true)"
          test "$active_after" = "${selected}=y"
          grep -qx 'CONFIG_PACKAGE_kmod-crypto-hw-eip93=m' .config
          grep -qx 'CONFIG_PACKAGE_kmod-crypto-des=m' .config
          grep -qx 'CONFIG_PACKAGE_kmod-crypto-md5=m' .config

          if grep -q '^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_nokia_xg-040g-md-ubi-usb-sfp=y$' .config; then
            echo 'Unexpected USB-SFP device profile enabled' >&2
            exit 1
          fi

          {
            echo 'Selected target: airoha/an7581'
            echo 'Selected device: nokia_xg-040g-md-ubi'
            echo 'Expected DTS: an7581-nokia_xg-040g-md-ubi'
            echo 'Expected primary image: sysupgrade.itb'
            echo 'EIP93 kmod: CONFIG_PACKAGE_kmod-crypto-hw-eip93=m'
            echo 'DES/MD5 providers: standalone kmod packages'
            echo 'Active AN7581 device selectors:'
            printf '%s\n' "$active_after"
          } | tee single-device-config-check.txt

      - name: Airoha and EIP93 exact patch replay gate before compilation
        shell: bash
        run: |
          set -euo pipefail
          make target/linux/prepare V=s 2>&1 | tee eip93-patch-replay.log

          python3 - <<'PY'
          import re
          from pathlib import Path

          expected = [
              "927-crypto-eip93-aead.patch",
              "928-crypto-eip93-cipher.patch",
              "929-crypto-eip93-cipher-h.patch",
              "930a-crypto-eip93-common.patch",
              "931-crypto-eip93-common-h.patch",
              "932-crypto-eip93-hash.patch",
              "933-crypto-eip93-hash-h.patch",
              "935-crypto-eip93-main.patch",
              "935a-crypto-eip93-main-h.patch",
          ]
          actual_files = sorted(
              p.name for p in Path("target/linux/generic/hack-6.18").glob("*eip93*.patch")
          )
          if actual_files != sorted(expected):
              raise SystemExit(
                  f"EIP93 patch file set mismatch: expected={sorted(expected)}, actual={actual_files}"
              )
          lines = Path("eip93-patch-replay.log").read_text(errors="replace").splitlines()
          sections, order, active = {}, [], None
          applying = re.compile(r"^Applying .*?/([^/]+\.patch)(?:\s|$)")
          for line in lines:
              match = applying.search(line)
              if match:
                  name = match.group(1)
                  active = name if name in expected else None
                  if active:
                      order.append(active)
                      sections.setdefault(active, []).append(line)
                  continue
              if active:
                  sections[active].append(line)

          missing = [name for name in expected if name not in sections]
          duplicates = [name for name in expected if order.count(name) != 1]
          if missing or duplicates or order != expected:
              raise SystemExit(
                  f"EIP93 patch order/application mismatch: missing={missing}, "
                  f"duplicates={duplicates}, actual_order={order}"
              )

          bad = re.compile(
              r"with fuzz|offset\s+-?\d+\s+lines?|FAILED|malformed patch|"
              r"Reversed \(or previously applied\)|can't find file to patch|"
              r"unexpected end of file",
              re.I,
          )
          errors = []
          for name in expected:
              body = sections[name]
              if not any("patching file " in line for line in body):
                  errors.append(f"{name}: no patching-file confirmation")
              errors.extend(f"{name}: {line}" for line in body if bad.search(line))
          if errors:
              raise SystemExit(
                  "EIP93 patch replay failed zero-fuzz/zero-offset gate:\n"
                  + "\n".join(errors)
              )
          print(f"PASS: all {len(expected)} EIP93 patches applied once in order, zero fuzz/offset/reject.")
          PY

          python3 - <<'PY'
          import re
          from pathlib import Path

          candidates = list(Path("build_dir").glob(
              "target-*/linux-*/linux-6.18.65/drivers/crypto/inside-secure/eip93/eip93-regs.h"
          ))
          if len(candidates) != 1:
              raise SystemExit(
                  f"Expected one prepared Linux 6.18.65 EIP93 register header, found: {candidates}"
              )
          header = candidates[0]
          text = header.read_text()
          match = re.search(
              r"^\s*#define\s+EIP93_SA_CMD_SSL_MAC\s+BIT\(11\)\s*(?:/\*.*?\*/)?$",
              text,
              re.M,
          )
          if not match:
              raise SystemExit(
                  f"Upstream Linux 6.18.65 EIP93 SSL_MAC definition was not preserved: {header}"
              )
          print(f"PASS: upstream EIP93_SA_CMD_SSL_MAC BIT(11) preserved in {header}")
          PY

          python3 - <<'PY
          import re
          from pathlib import Path

          patch_dir = Path("target/linux/airoha/patches-6.18")
          expected = sorted(p.name for p in patch_dir.glob("*.patch"))
          if not expected:
              raise SystemExit("No Airoha 6.18 target patches found")

          lines = Path("eip93-patch-replay.log").read_text(errors="replace").splitlines()
          sections, order, active = {}, [], None
          applying = re.compile(r"^Applying .*?/target/linux/airoha/patches-6\.18/([^/\s]+\.patch)(?:\s|$)")
          for line in lines:
              match = applying.search(line)
              if match:
                  active = match.group(1)
                  order.append(active)
                  sections.setdefault(active, []).append(line)
                  continue
              if active:
                  sections[active].append(line)

          missing = [name for name in expected if name not in sections]
          unexpected = [name for name in order if name not in expected]
          duplicates = [name for name in expected if order.count(name) != 1]
          if missing or unexpected or duplicates:
              raise SystemExit(
                  f"Airoha patch application mismatch: missing={missing}, "
                  f"unexpected={unexpected}, duplicates={duplicates}, order={order}"
              )

          bad = re.compile(
              r"with fuzz|offset\s+-?\d+\s+lines?|FAILED|malformed patch|"
              r"Reversed \(or previously applied\)|can't find file to patch|"
              r"unexpected end of file", re.I
          )
          errors = []
          for name in expected:
              body = sections[name]
              if not any("patching file " in line for line in body):
                  errors.append(f"{name}: no patching-file confirmation")
              errors.extend(f"{name}: {line}" for line in body if bad.search(line))
          if errors:
              raise SystemExit(
                  "Airoha patch replay failed zero-fuzz/zero-offset gate:\n"
                  + "\n".join(errors)
              )

          print(
              f"PASS: all {len(expected)} Airoha target patches applied once, "
              "zero fuzz/offset/reject."
          )
          print(f"902 SkyHigh patch included: {'902-mtd-spinand-skyhigh-s35ml02-ready-confirm.patch' in expected}")
          PY

          expected_hash='c92606f956f09dc50b5a0e2af9e86763fce27ada1647de97f8d1ac8cfc95801d'
          actual_hash="$(sha256sum dl/linux-6.18.65.tar.xz | awk '{print $1}')"
          test "$actual_hash" = "$expected_hash"
          {
            echo "Linux 6.18.65 source archive SHA256: $actual_hash"
            echo "Airoha target patch replay: PASS"
            echo "EIP93 native patch replay: PASS"
            echo "Compilation starts only after this gate."
          } | tee eip93-patch-replay-report.txt

      - name: Build firmware
        shell: bash
        run: |
          set -o pipefail
          make -j"$(nproc)" V=s 2>&1 | tee build.log

      - name: Verify EN7572 is integrated into Nokia firmware
        shell: bash
        run: |
          set -euo pipefail
          grep -qx 'CONFIG_PACKAGE_kmod-airoha-en7572=y' .config
          grep -qx 'CONFIG_PACKAGE_kmod-airoha-pon-frontend=y' .config
          image_dir='bin/targets/airoha/an7581'
          find "$image_dir" -maxdepth 1 -type f -name '*.manifest' -print > en7572-manifests.txt
          test -s en7572-manifests.txt
          : > en7572-manifest-matches.txt
          while IFS= read -r manifest; do
            if grep -Eq '^kmod-airoha-en7572([[:space:]]|$)' "$manifest" && grep -Eq '^kmod-airoha-pon-frontend([[:space:]]|$)' "$manifest"; then
              printf '%s\n' "$manifest" >> en7572-manifest-matches.txt
            fi
          done < en7572-manifests.txt
          test -s en7572-manifest-matches.txt
          find_rootfs_file() {
            local relative_path="$1" description="$2"
            local -a matches=()
            mapfile -t matches < <(find staging_dir -type f -path "*/root-*/$relative_path" -print)
            if [ "${#matches[@]}" -ne 1 ] || [ ! -s "${matches[0]:-}" ]; then
              printf 'Expected exactly one non-empty staged %s; found %s\n' "$description" "${#matches[@]}" >&2
              printf '%s\n' "${matches[@]}" >&2
              exit 1
            fi
            printf '%s\n' "${matches[0]}"
          }
          en7572_ko="$(find_rootfs_file 'lib/modules/*/airoha-en7572.ko' 'EN7572 module')"
          frontend_ko="$(find_rootfs_file 'lib/modules/*/airoha-pon-frontend-core.ko' 'PON frontend core module')"
          firmware_pm="$(find_rootfs_file 'lib/firmware/airoha/en7572/A60993.elf.pm' 'EN7572 PM firmware')"
          firmware_dm="$(find_rootfs_file 'lib/firmware/airoha/en7572/A60993.elf.dm' 'EN7572 DM firmware')"
          {
            echo 'EN7572 firmware integration: PASS'
            cat en7572-manifest-matches.txt
            sha256sum "$en7572_ko" "$frontend_ko" "$firmware_pm" "$firmware_dm"
          } | tee ponwrt-en7572-firmware-integration.txt

      - name: Verify EIP93 is integrated into Nokia XG-040G-MD UBI firmware
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t linux_build_dirs < <(find build_dir -type d -name 'linux-airoha_an7581' -print)
          if [ "${#linux_build_dirs[@]}" -ne 1 ]; then
            printf 'Expected exactly one AN7581 Linux build directory; found %s\n' "${#linux_build_dirs[@]}" >&2
            printf '%s\n' "${linux_build_dirs[@]}" >&2
            exit 1
          fi
          mapfile -t roots < <(find "${linux_build_dirs[0]}" -mindepth 1 -maxdepth 1 -type d -name 'target-dir-*' -print)
          if [ "${#roots[@]}" -ne 1 ]; then
            printf 'Expected exactly one completed AN7581 image root; found %s\n' "${#roots[@]}" >&2
            printf '%s\n' "${roots[@]}" >&2
            exit 1
          fi
          image_root="${roots[0]}"
          installed_db="$image_root/lib/apk/db/installed"
          if [ ! -s "$installed_db" ] || ! grep -qx 'P:kmod-crypto-hw-eip93' "$installed_db"; then
            echo 'kmod-crypto-hw-eip93 is not installed in the Nokia image root' >&2
            exit 1
          fi
          mapfile -t modules < <(find "$image_root" -type f -path '*/lib/modules/*/crypto-hw-eip93.ko' -print)
          if [ "${#modules[@]}" -ne 1 ] || [ ! -s "${modules[0]:-}" ]; then
            printf 'Expected exactly one non-empty EIP93 module in the Nokia image root; found %s\n' "${#modules[@]}" >&2
            printf '%s\n' "${modules[@]}" >&2
            exit 1
          fi
          {
            echo 'EIP93 Nokia XG-040G-MD UBI firmware integration: PASS'
            echo "Image root: $image_root"
            grep -x 'P:kmod-crypto-hw-eip93' "$installed_db"
            sha256sum "${modules[0]}"
          } | tee eip93-firmware-integration.txt

      - name: Collect standalone PonWrt kmods from native build
        shell: bash
        run: |
          set -euo pipefail
          package_dir='bin/targets/airoha/an7581/packages'
          mkdir -p output/kmods

          mapfile -t standalone_kmods < <(
            sed -nE 's/^CONFIG_PACKAGE_(kmod-[A-Za-z0-9+_.+-]+)=m$/\1/p' .config | sort -u
          )
          mapfile -t firmware_kmods < <(
            sed -nE 's/^CONFIG_PACKAGE_(kmod-[A-Za-z0-9+_.+-]+)=y$/\1/p' .config | sort -u
          )

          if [ ! -d "$package_dir" ]; then
            echo "Missing native PonWrt package directory: $package_dir" >&2
            exit 1
          fi

          {
            echo "PonWrt commit: ${GITHUB_SHA}"
            echo "Firmware .config SHA256: $(sha256sum .config | awk '{print $1}')"
            echo "Kernel config selector: $(grep -E '^CONFIG_LINUX_[0-9_]+=y$' .config | head -n1)"
            echo "Standalone kmod count: ${#standalone_kmods[@]}"
            echo "Firmware-integrated kmod count: ${#firmware_kmods[@]}"
            echo
            echo 'Firmware-integrated kmods (=y; excluded from standalone bundle):'
            printf '  %s\n' "${firmware_kmods[@]}"
            echo
            echo 'Standalone kmods (=m; must be present as native PonWrt APKs):'
            printf '  %s\n' "${standalone_kmods[@]}"
          } | tee ponwrt-kmod-build-info.txt

          : > output/kmods/STANDALONE-KMODS.txt
          : > output/kmods/SHA256SUMS
          missing=0
          for package in "${standalone_kmods[@]}"; do
            mapfile -t matches < <(find "$package_dir" -maxdepth 1 -type f -name "${package}-[0-9]*.apk" -print | sort)
            if [ "${#matches[@]}" -ne 1 ] || [ ! -s "${matches[0]:-}" ]; then
              printf 'Expected exactly one non-empty native PonWrt APK for %s; found %s\n' "$package" "${#matches[@]}" >&2
              printf '%s\n' "${matches[@]}" >&2
              missing=1
              continue
            fi
            install -m 0644 "${matches[0]}" "output/kmods/$(basename "${matches[0]}")"
            printf '%s\n' "$package" >> output/kmods/STANDALONE-KMODS.txt
          done
          if [ "$missing" -ne 0 ]; then
            echo 'One or more configured standalone kmods are missing; refusing partial publication.' >&2
            exit 1
          fi

          check_apk_module() {
            local package="$1" module="$2"
            local -a apks=()
            mapfile -t apks < <(find output/kmods -maxdepth 1 -type f -name "${package}-[0-9]*.apk" -print)
            if [ "${#apks[@]}" -ne 1 ] || [ ! -s "${apks[0]:-}" ]; then
              printf 'Expected exactly one APK for %s; found %s\n' "$package" "${#apks[@]}" >&2
              exit 1
            fi
            test -x staging_dir/host/bin/apk
            extract_dir="$(mktemp -d)"
            if ! staging_dir/host/bin/apk extract --allow-untrusted --destination "$extract_dir" "${apks[0]}"; then
              rm -rf "$extract_dir"
              echo "Host apk-tools could not extract $package" >&2
              exit 1
            fi
            if ! find "$extract_dir" -type f -name "$module" -print -quit | grep -q .; then
              rm -rf "$extract_dir"
              echo "Standalone APK $package does not contain $module" >&2
              exit 1
            fi
            rm -rf "$extract_dir"
            echo "PASS: $package contains $module"
          }
          check_apk_module kmod-crypto-hw-eip93 crypto-hw-eip93.ko
          check_apk_module kmod-crypto-des libdes.ko
          check_apk_module kmod-crypto-md5 libmd5.ko

          (
            cd output/kmods
            find . -maxdepth 1 -type f -name '*.apk' -print0 | sort -z | xargs -0 -r sha256sum
          ) > output/kmods/SHA256SUMS
          {
            echo "PonWrt commit: ${GITHUB_SHA}"
            echo "Firmware .config SHA256: $(sha256sum .config | awk '{print $1}')"
            echo "Standalone kmod APK count: $(find output/kmods -maxdepth 1 -type f -name '*.apk' | wc -l)"
            echo
            echo 'Standalone kmods:'
            cat output/kmods/STANDALONE-KMODS.txt
            echo
            echo 'SHA256:'
            cat output/kmods/SHA256SUMS
          } > output/kmods/BUILD-INFO.txt

      - name: Verify and stage firmware and Bootloader artifacts
        shell: bash
        run: |
          set -euo pipefail
          image_dir='bin/targets/airoha/an7581'
          find_one() {
            local pattern="$1" description="$2"
            local -a matches=()
            mapfile -t matches < <(find "$image_dir" -maxdepth 1 -type f -name "$pattern" -print)
            if [ "${#matches[@]}" -ne 1 ] || [ ! -s "${matches[0]:-}" ]; then
              printf 'Expected exactly one non-empty %s (%s); found %s\n' "$description" "$pattern" "${#matches[@]}" >&2
              printf '%s\n' "${matches[@]}" >&2
              exit 1
            fi
            printf '%s\n' "${matches[0]}"
          }
          sysupgrade="$(find_one '*sysupgrade.itb' 'sysupgrade image')"
          preloader="$(find_one '*-preloader.bin' 'Preloader artifact')"
          fip="$(find_one '*-bl31-uboot.fip' 'BL31/U-Boot FIP artifact')"
          mapfile -t uboot_configs < <(find build_dir/target-* -type f -path '*/u-boot-an7581_nokia_xg-040g-md/u-boot-*/.config' -print 2>/dev/null)
          if [ "${#uboot_configs[@]}" -ne 1 ]; then
            printf 'Expected exactly one Nokia XG-040G-MD U-Boot config; found %s\n' "${#uboot_configs[@]}" >&2
            printf '%s\n' "${uboot_configs[@]}" >&2
            exit 1
          fi
          uboot_dir="${uboot_configs[0]%/.config}"
          grep -qx 'CONFIG_DM_RNG=y' "${uboot_configs[0]}"
          grep -qx 'CONFIG_RNG_AIROHA=y' "${uboot_configs[0]}"
          ! grep -qx 'CONFIG_ARMV8_SEC_FIRMWARE_SUPPORT=y' "${uboot_configs[0]}"
          ! grep -qx 'CONFIG_MEASURED_BOOT=y' "${uboot_configs[0]}"
          test -s "$uboot_dir/drivers/rng/airoha-rng.o"
          grep -q 'fdt_kaslrseed(fdt, false)' "$uboot_dir/boot/fdt_support.c"
          grep -q 'compatible = "airoha,en7581-trng"' "$uboot_dir/dts/upstream/src/arm64/airoha/en7581.dtsi"
          mapfile -t kernel_configs < <(find build_dir/target-* -type f -path '*/linux-airoha_an7581/linux-6.18.*/.config' -print)
          if [ "${#kernel_configs[@]}" -ne 1 ]; then
            printf 'Expected exactly one Linux 6.18 kernel config; found %s\n' "${#kernel_configs[@]}" >&2
            printf '%s\n' "${kernel_configs[@]}" >&2
            exit 1
          fi
          grep -qx 'CONFIG_RANDOMIZE_BASE=y' "${kernel_configs[0]}"
          grep -qx 'CONFIG_CRYPTO_DEV_EIP93=m' "${kernel_configs[0]}"
          grep -qx 'CONFIG_CRYPTO_DES=m' "${kernel_configs[0]}"
          grep -qx 'CONFIG_CRYPTO_MD5=m' "${kernel_configs[0]}"
          kernel_dir="${kernel_configs[0]%/.config}"
          test -s "$kernel_dir/drivers/crypto/inside-secure/eip93/crypto-hw-eip93.ko"
          test -s "$kernel_dir/lib/crypto/libdes.ko"
          test -s "$kernel_dir/lib/crypto/libmd5.ko"
          eip93_module="$kernel_dir/drivers/crypto/inside-secure/eip93/crypto-hw-eip93.ko"
          eip93_deps="$(modinfo -F depends "$eip93_module")"
          printf '%s\n' "$eip93_deps" | tee eip93-module-dependencies.txt
          for provider in libdes md5; do
            case ",$eip93_deps," in
              *",$provider,"*) ;;
              *) echo "EIP93 module missing runtime dependency $provider: $eip93_deps" >&2; exit 1 ;;
            esac
          done
          mkdir -p output
          install -m 0644 "$sysupgrade" output/nokia_xg-040g-md-ubi-sysupgrade.itb
          install -m 0644 "$fip" output/bl31-uboot.fip
          install -m 0644 "$preloader" output/preloader.bin
          find dl -type f -print0 | sort -z | xargs -0 -r sha256sum > output/SOURCE-ARCHIVES-SHA256SUMS
          sha256sum output/nokia_xg-040g-md-ubi-sysupgrade.itb output/bl31-uboot.fip output/preloader.bin > output/SHA256SUMS
          find output/kmods -maxdepth 1 -type f -name '*.apk' -print0 | sort -z | xargs -0 -r sha256sum >> output/SHA256SUMS
          {
            echo "Repository: ${GITHUB_REPOSITORY}"
            echo "Commit: ${GITHUB_SHA}"
            echo 'Target: airoha/an7581'
            echo 'Device: nokia_xg-040g-md-ubi'
            echo "Built at (UTC): $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo 'Source revisions and lock:'
            cat source-revisions.txt
            echo 'Artifact SHA256:'
            cat output/SHA256SUMS
            echo "Downloaded source files SHA256 entries: $(wc -l < output/SOURCE-ARCHIVES-SHA256SUMS)"
            echo 'Downloaded source archive SHA256 manifest: output/SOURCE-ARCHIVES-SHA256SUMS'
            echo 'EN7572 firmware integration:'
            cat ponwrt-en7572-firmware-integration.txt
            echo 'Airoha TRNG / KASLR seed build path: PASS'
            grep -E '^CONFIG_(DM_RNG|RNG_AIROHA)=y$' "${uboot_configs[0]}"
            echo "U-Boot build tree: ${uboot_dir}"
            echo "Linux kernel config: ${kernel_configs[0]}"
            echo 'Linux CONFIG_RANDOMIZE_BASE=y'
            echo 'U-Boot fdt_chosen() auto-injects /chosen/kaslr-seed via the Airoha TRNG; runtime entropy remains a device-side verification.'
            echo 'Standalone PonWrt kmod APKs:'
            cat output/kmods/SHA256SUMS
          } > output/BUILD-INFO.txt

      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: ponwrt-nokia-xg-040g-md-ubi-sysupgrade
          path: output/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ponwrt-nokia-xg-040g-md-ubi-build-diagnostics
          path: |
            source-revisions.txt
            single-device-config-check.txt
            download.log
            eip93-patch-replay.log
            eip93-patch-replay-report.txt
            ponwrt-en7572-firmware-integration.txt
            ponwrt-kmod-build-info.txt
            output/kmods/BUILD-INFO.txt
            output/kmods/SHA256SUMS
            output/SOURCE-ARCHIVES-SHA256SUMS
            output/BUILD-INFO.txt
            eip93-module-dependencies.txt
            build.log
            build_dir/target-*/linux-airoha_an7581/linux-6.18.65/drivers/mtd/nand/spi/core.c
            build_dir/target-*/linux-airoha_an7581/linux-6.18.65/drivers/mtd/nand/spi/skyhigh.c*
            build_dir/target-*/linux-airoha_an7581/linux-6.18.65/include/linux/mtd/spinand.h*
          if-no-files-found: ignore
          retention-days: 14
