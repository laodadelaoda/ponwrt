name: Build Nokia XG-040G-MD UBI (AN7581)
run-name: Nokia XG-040G-MD UBI build

on:
  push:
    branches:
      - epon1g-nokia-xg-040g-md
    paths:
      - .github/workflows/nokia-xg-040g-md-ubi.yml
      - target/linux/airoha/dts/**
      - target/linux/airoha/patches-6.18/402-*.patch
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nokia-xg-040g-md-ubi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: AN7581 / Nokia XG-040G-MD UBI
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout PonWrt
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Free build space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk \
            gettext git g++-multilib gcc-multilib gperf help2man intltool \
            libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev lld llvm ninja-build p7zip-full patch pkgconf \
            python3 python3-docutils python3-pip python3-ply python3-pyelftools \
            qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs unzip wget xmlto xxd zlib1g-dev zstd

      - name: Verify main source revision
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$GITHUB_SHA"
          echo "PonWrt source SHA: $actual" | tee source-revisions.txt

      - name: Update and install pinned feeds
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/feeds update -a

          check_feed() {
            local name="$1" expected_url="$2" expected_sha="$3"
            local actual_url actual_sha
            test -d "feeds/$name/.git"
            actual_url="$(git -C "feeds/$name" remote get-url origin)"
            actual_sha="$(git -C "feeds/$name" rev-parse HEAD)"
            test "$actual_url" = "$expected_url"
            test "$actual_sha" = "$expected_sha"
            printf '%s SHA: %s\n%s URL: %s\n' "$name" "$actual_sha" "$name" "$actual_url" | tee -a source-revisions.txt
          }

          check_feed pon_drivers https://github.com/laodadelaoda/openwrt-pon-drivers.git e4a43262a7dbf9abe269e5661e81dc302a37d822
          check_feed pon_userspace https://github.com/pbs05/openwrt-pon-userspace.git a903fcc80f4b89f9b9e59a02d3ba1fc5550819a5

          ./scripts/feeds install -a

      - name: Derive a single-device configuration
        shell: bash
        run: |
          set -euo pipefail
          selected='CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_nokia_xg-040g-md-ubi'
          tmp_cfg="$(mktemp)"
          trap 'rm -f "$tmp_cfg"' EXIT

          awk -v selected="$selected" '
            /^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_.*=y$/ {
              if ($0 == selected "=y") {
                print
              } else {
                sub(/^CONFIG_/, "# CONFIG_")
                sub(/=y$/, " is not set")
                print
              }
              next
            }
            { print }
          ' configs/an7581.config > "$tmp_cfg"

          grep -qx "${selected}=y" "$tmp_cfg"
          active_before="$(grep -E '^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_.*=y$' "$tmp_cfg" || true)"
          test "$active_before" = "${selected}=y"

          ./scripts/kconfig.pl + "$tmp_cfg" configs/release.config > .config
          make defconfig

          grep -qx 'CONFIG_TARGET_airoha=y' .config
          grep -qx 'CONFIG_TARGET_airoha_an7581=y' .config
          grep -qx 'CONFIG_TARGET_MULTI_PROFILE=y' .config
          grep -qx 'CONFIG_TARGET_PER_DEVICE_ROOTFS=y' .config

          active_after="$(grep -E '^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_.*=y$' .config || true)"
          test "$active_after" = "${selected}=y"

          if grep -q '^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_nokia_xg-040g-md-ubi-usb-sfp=y$' .config; then
            echo 'Unexpected USB-SFP device profile enabled' >&2
            exit 1
          fi

          {
            echo 'Selected target: airoha/an7581'
            echo 'Selected device: nokia_xg-040g-md-ubi'
            echo 'Expected DTS: an7581-nokia_xg-040g-md-ubi'
            echo 'Expected primary image: sysupgrade.itb'
            echo 'Active AN7581 device selectors:'
            printf '%s\n' "$active_after"
          } | tee single-device-config-check.txt

      - name: Download sources
        shell: bash
        run: |
          set -o pipefail
          make download -j"$(nproc)" 2>&1 | tee download.log

      - name: Build firmware
        shell: bash
        run: |
          set -o pipefail
          make -j"$(nproc)" V=s 2>&1 | tee build.log

      - name: Verify and stage the single sysupgrade image
        shell: bash
        run: |
          set -euo pipefail
          image_dir='bin/targets/airoha/an7581'
          test -d "$image_dir"

          mapfile -t images < <(find "$image_dir" -maxdepth 1 -type f -name '*sysupgrade.itb' -print)
          if [ "${#images[@]}" -ne 1 ]; then
            printf 'Expected exactly one sysupgrade.itb, found %s\n' "${#images[@]}" >&2
            printf '%s\n' "${images[@]}" >&2
            exit 1
          fi

          mkdir -p output
          install -m 0644 "${images[0]}" output/nokia_xg-040g-md-ubi-sysupgrade.itb
          sha256sum output/nokia_xg-040g-md-ubi-sysupgrade.itb > output/SHA256SUMS

          {
            echo "Repository: ${GITHUB_REPOSITORY}"
            echo "Commit: ${GITHUB_SHA}"
            echo 'Target: airoha/an7581'
            echo 'Device: nokia_xg-040g-md-ubi'
            echo 'DTS: an7581-nokia_xg-040g-md-ubi'
            echo "Source image: ${images[0]}"
            echo 'Artifact: nokia_xg-040g-md-ubi-sysupgrade.itb'
            echo "Built at (UTC): $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } > output/BUILD-INFO.txt

      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ponwrt-nokia-xg-040g-md-ubi-sysupgrade
          path: output/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ponwrt-nokia-xg-040g-md-ubi-build-diagnostics
          path: |
            source-revisions.txt
            source-revisions.txt
            single-device-config-check.txt
            download.log
            build.log
          if-no-files-found: ignore
          retention-days: 14
