name: Build Nokia XG-040G-MD UBI (AN7581)
run-name: Nokia XG-040G-MD UBI build

on:
  push:
    branches:
      - epon1g-nokia-xg-040g-md
    paths:
      - .github/workflows/nokia-xg-040g-md-ubi.yml
      - configs/an7581.config
      - configs/release.config
      - feeds.conf.default
      - package/boot/arm-trusted-firmware-airoha/**
      - package/boot/uboot-airoha/**
      - package/kernel/**
      - include/kernel*.mk
      - scripts/feeds
      - target/linux/airoha/**
      - target/linux/generic/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nokia-xg-040g-md-ubi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: AN7581 / Nokia XG-040G-MD UBI
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout PonWrt
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Free build space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk \
            gettext git g++-multilib gcc-multilib gperf help2man intltool \
            libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev lld llvm ninja-build p7zip-full patch pkgconf \
            python3 python3-docutils python3-pip python3-ply python3-pyelftools \
            qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs unzip wget xmlto xxd zlib1g-dev zstd

      - name: Verify main source revision
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$GITHUB_SHA"
          echo "PonWrt source SHA: $actual" | tee source-revisions.txt

      - name: Update and install pinned feeds
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/feeds update -a

          check_feed() {
            local name="$1" expected_url="$2" expected_sha="$3"
            local actual_url actual_sha
            test -d "feeds/$name/.git"
            actual_url="$(git -C "feeds/$name" remote get-url origin)"
            actual_sha="$(git -C "feeds/$name" rev-parse HEAD)"
            test "$actual_url" = "$expected_url"
            test "$actual_sha" = "$expected_sha"
            printf '%s SHA: %s\n%s URL: %s\n' "$name" "$actual_sha" "$name" "$actual_url" | tee -a source-revisions.txt
          }

          check_feed pon_drivers https://github.com/laodadelaoda/openwrt-pon-drivers.git e4a43262a7dbf9abe269e5661e81dc302a37d822
          check_feed pon_userspace https://github.com/laodadelaoda/openwrt-pon-userspace.git a903fcc80f4b89f9b9e59a02d3ba1fc5550819a5

          ./scripts/feeds install -a

      - name: Derive a single-device configuration
        shell: bash
        run: |
          set -euo pipefail
          selected='CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_nokia_xg-040g-md-ubi'
          tmp_cfg="$(mktemp)"
          trap 'rm -f "$tmp_cfg"' EXIT

          awk -v selected="$selected" '
            /^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_.*=y$/ {
              if ($0 == selected "=y") {
                print
              } else {
                sub(/^CONFIG_/, "# CONFIG_")
                sub(/=y$/, " is not set")
                print
              }
              next
            }
            { print }
          ' configs/an7581.config > "$tmp_cfg"

          grep -qx "${selected}=y" "$tmp_cfg"
          active_before="$(grep -E '^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_.*=y$' "$tmp_cfg" || true)"
          test "$active_before" = "${selected}=y"

          ./scripts/kconfig.pl + "$tmp_cfg" configs/release.config > .config
          make defconfig

          grep -qx 'CONFIG_TARGET_airoha=y' .config
          grep -qx 'CONFIG_TARGET_airoha_an7581=y' .config
          grep -qx 'CONFIG_TARGET_MULTI_PROFILE=y' .config
          grep -qx 'CONFIG_TARGET_PER_DEVICE_ROOTFS=y' .config

          active_after="$(grep -E '^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_.*=y$' .config || true)"
          test "$active_after" = "${selected}=y"

          if grep -q '^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_nokia_xg-040g-md-ubi-usb-sfp=y$' .config; then
            echo 'Unexpected USB-SFP device profile enabled' >&2
            exit 1
          fi

          {
            echo 'Selected target: airoha/an7581'
            echo 'Selected device: nokia_xg-040g-md-ubi'
            echo 'Expected DTS: an7581-nokia_xg-040g-md-ubi'
            echo 'Expected primary image: sysupgrade.itb'
            echo 'Active AN7581 device selectors:'
            printf '%s\n' "$active_after"
          } | tee single-device-config-check.txt

      - name: Download sources
        shell: bash
        run: |
          set -o pipefail
          make download -j"$(nproc)" 2>&1 | tee download.log

      - name: Build firmware
        shell: bash
        run: |
          set -o pipefail
          make -j"$(nproc)" V=s 2>&1 | tee build.log

      - name: Verify EN7572 is integrated into Nokia firmware
        shell: bash
        run: |
          set -euo pipefail

          # EN7572 must be part of the device firmware, not a standalone APK.
          grep -qx 'CONFIG_PACKAGE_kmod-airoha-en7572=y' .config
          grep -qx 'CONFIG_PACKAGE_kmod-airoha-pon-frontend=y' .config

          image_dir='bin/targets/airoha/an7581'
          find "$image_dir" -type f -name '*.manifest' -print > en7572-manifests.txt
          test -s en7572-manifests.txt || {
            echo 'No final image package manifest found; cannot verify EN7572 integration' >&2
            exit 1
          }

          : > en7572-manifest-matches.txt
          while IFS= read -r manifest; do
            if grep -Eq '^kmod-airoha-en7572([[:space:]]|$)' "$manifest" &&
              grep -Eq '^kmod-airoha-pon-frontend([[:space:]]|$)' "$manifest"; then
              printf '%s\n' "$manifest" >> en7572-manifest-matches.txt
            fi
          done < en7572-manifests.txt
          test -s en7572-manifest-matches.txt || {
            echo 'Final image manifest lacks EN7572 or its frontend-core dependency' >&2
            cat en7572-manifests.txt >&2
            exit 1
          }

          find_rootfs_file() {
            relative_path="$1"
            description="$2"
            result_file="$(mktemp)"
            find build_dir -type f -path "*/root-*/$relative_path" -print > "$result_file"
            count="$(wc -l < "$result_file")"
            if [ "$count" -ne 1 ]; then
              printf 'Expected exactly one staged %s; found %s\n' "$description" "$count" >&2
              cat "$result_file" >&2
              rm -f "$result_file"
              exit 1
            fi
            result="$(cat "$result_file")"
            rm -f "$result_file"
            test -s "$result" || {
              printf 'Staged %s is empty: %s\n' "$description" "$result" >&2
              exit 1
            }
            printf '%s\n' "$result"
          }

          en7572_ko="$(find_rootfs_file 'lib/modules/*/airoha-en7572.ko' 'EN7572 kernel module')"
          frontend_ko="$(find_rootfs_file 'lib/modules/*/airoha-pon-frontend-core.ko' 'PON frontend core kernel module')"
          firmware_pm="$(find_rootfs_file 'lib/firmware/airoha/en7572/A60993.elf.pm' 'EN7572 PM firmware')"
          firmware_dm="$(find_rootfs_file 'lib/firmware/airoha/en7572/A60993.elf.dm' 'EN7572 DM firmware')"

          echo 'EN7572 firmware integration: PASS' | tee ponwrt-en7572-firmware-integration.txt
          cat en7572-manifest-matches.txt | tee -a ponwrt-en7572-firmware-integration.txt
          sha256sum "$en7572_ko" "$frontend_ko" "$firmware_pm" "$firmware_dm" | tee -a ponwrt-en7572-firmware-integration.txt
      - name: Build only required standalone PonWrt kmods
        shell: bash
        run: |
          set -euo pipefail

          # These are the only required Airoha PON kernel packages in this
          # device profile. Their original y/m selections remain authoritative.
          required_kmods=(
            kmod-airoha-en7572
            kmod-airoha-paged-bosa
            kmod-airoha-xpon
          )

          firmware_config_sha="$(sha256sum .config | awk '{print $1}')"
          standalone_kmods=()
          firmware_kmods=()
          for package in "${required_kmods[@]}"; do
            setting="$(sed -n "s/^CONFIG_PACKAGE_${package}=\\(.*\\)$/\\1/p" .config)"
            case "$setting" in
              m) standalone_kmods+=("$package") ;;
              y) firmware_kmods+=("$package") ;;
              *)
                printf 'Required PonWrt kmod %s has unsupported selection: %s\n' "$package" "${setting:-unset}" >&2
                exit 1
                ;;
            esac
          done

          {
            echo "PonWrt commit: ${GITHUB_SHA}"
            echo "Original firmware config SHA256: $(sha256sum .config | awk '{print $1}')"
            echo 'Original package selections (unchanged):'
            for package in "${firmware_kmods[@]}"; do
              printf '  firmware-integrated: %s\n' "$package"
            done
            for package in "${standalone_kmods[@]}"; do
              printf '  standalone APK: %s\n' "$package"
            done
          } | tee ponwrt-kmod-build-info.txt

          mkdir -p output/kmods
          if [ "${#standalone_kmods[@]}" -gt 0 ]; then
            # The three Airoha PON kmods are provided by pinned PonWrt feeds,
            # not the ImmortalWrt base package tree. Build only their native
            # feed package directories; do not run the global package/compile.
            declare -A package_targets=()
            for package in "${standalone_kmods[@]}"; do
              case "$package" in
                kmod-airoha-en7572|kmod-airoha-paged-bosa)
                  target='package/feeds/pon_drivers/airoha-pon-frontends/compile'
                  ;;
                kmod-airoha-xpon)
                  target='package/feeds/pon_drivers/airoha-xpon/compile'
                  ;;
                *)
                  printf 'No audited PonWrt feed build target for %s\n' "$package" >&2
                  exit 1
                  ;;
              esac
              package_targets["$target"]=1
            done

            test -f package/feeds/pon_drivers/airoha-pon-frontends/Makefile
            grep -q '^define KernelPackage/airoha-paged-bosa

            for package in "${standalone_kmods[@]}"; do
              mapfile -t matches < <(find bin/packages -type f -name "${package}_*.apk" -print)
              if [ "${#matches[@]}" -ne 1 ] || [ ! -s "${matches[0]:-}" ]; then
                printf 'Expected exactly one non-empty PonWrt-built APK for %s; found %s\n' "$package" "${#matches[@]}" >&2
                printf '%s\n' "${matches[@]}" >&2
                exit 1
              fi
              install -m 0644 "${matches[0]}" "output/kmods/$(basename "${matches[0]}")"
            done
          else
            echo 'No required standalone PonWrt kmods; all required Airoha PON kmods are firmware-integrated.'
          fi

          (cd output/kmods && find . -maxdepth 1 -type f -name '*.apk' -print0 | sort -z | xargs -0 -r sha256sum) > output/kmods/SHA256SUMS

          {
            echo "Repository: ${GITHUB_REPOSITORY}"
            echo "Commit: ${GITHUB_SHA}"
            echo 'Firmware-integrated PonWrt kmods:'
            printf '%s\n' "${firmware_kmods[@]}"
            echo
            echo 'Standalone PonWrt kmod APKs:'
            cat output/kmods/SHA256SUMS
          } > output/kmods/BUILD-INFO.txt

      - name: Verify and stage firmware and Bootloader artifacts
        shell: bash
        run: |
          set -euo pipefail
          image_dir='bin/targets/airoha/an7581'
          test -d "$image_dir"

          find_one() {
            local pattern="$1" description="$2"
            local -a matches=()
            mapfile -t matches < <(find "$image_dir" -maxdepth 1 -type f -name "$pattern" -print)
            if [ "${#matches[@]}" -ne 1 ]; then
              printf 'Expected exactly one %s (%s), found %s\n' "$description" "$pattern" "${#matches[@]}" >&2
              printf '%s\n' "${matches[@]}" >&2
              exit 1
            fi
            if [ ! -s "${matches[0]}" ]; then
              printf '%s is missing or empty: %s\n' "$description" "${matches[0]}" >&2
              exit 1
            fi
            printf '%s\n' "${matches[0]}"
          }

          sysupgrade="$(find_one '*sysupgrade.itb' 'sysupgrade image')"
          # ARTIFACT outputs are prefixed by DEVICE_IMG_PREFIX in OpenWrt.
          preloader="$(find_one '*-preloader.bin' 'Nokia Preloader artifact')"
          fip="$(find_one '*-bl31-uboot.fip' 'Nokia BL31/U-Boot FIP artifact')"

          # The Nokia U-Boot variant must retain the Airoha hardware RNG driver.
          mapfile -t uboot_configs < <(find build_dir -type f -path '*/u-boot-*/.config' -print)
          if [ "${#uboot_configs[@]}" -ne 1 ]; then
            printf 'Expected exactly one configured U-Boot build tree, found %s\n' "${#uboot_configs[@]}" >&2
            printf '%s\n' "${uboot_configs[@]}" >&2
            exit 1
          fi
          grep -qx 'CONFIG_DM_RNG=y' "${uboot_configs[0]}"
          grep -qx 'CONFIG_RNG_AIROHA=y' "${uboot_configs[0]}"

          mkdir -p output
          install -m 0644 "$sysupgrade" output/nokia_xg-040g-md-ubi-sysupgrade.itb
          install -m 0644 "$fip" output/bl31-uboot.fip
          install -m 0644 "$preloader" output/preloader.bin

          for artifact in \
            output/nokia_xg-040g-md-ubi-sysupgrade.itb \
            output/bl31-uboot.fip \
            output/preloader.bin; do
            test -s "$artifact"
          done

          sha256sum \
            output/nokia_xg-040g-md-ubi-sysupgrade.itb \
            output/bl31-uboot.fip \
            output/preloader.bin > output/SHA256SUMS
          find output/kmods -maxdepth 1 -type f -name '*.apk' -print0 | sort -z | xargs -0 -r sha256sum >> output/SHA256SUMS

          {
            echo "Repository: ${GITHUB_REPOSITORY}"
            echo "Commit: ${GITHUB_SHA}"
            echo 'Target: airoha/an7581'
            echo 'Device: nokia_xg-040g-md-ubi'
            echo 'DTS: an7581-nokia_xg-040g-md-ubi'
            echo "Built at (UTC): $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo
            echo 'Source revisions:'
            cat source-revisions.txt
            echo
            echo 'Artifact SHA256:'
            cat output/SHA256SUMS
            echo
            echo 'EN7572 firmware integration verification:'
            cat ponwrt-en7572-firmware-integration.txt
            echo
            echo 'U-Boot RNG build configuration:'
            printf 'U-Boot config: %s\n' "${uboot_configs[0]}"
            grep -E '^CONFIG_(DM_RNG|RNG_AIROHA)=y$' "${uboot_configs[0]}"
            echo 'Note: this proves the hardware RNG driver is enabled in the built U-Boot configuration; actual entropy/seed delivery requires device-side runtime verification.'
            echo
            echo 'Supplementary PonWrt kmods:'
            cat output/kmods/SHA256SUMS
          } > output/BUILD-INFO.txt

      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ponwrt-nokia-xg-040g-md-ubi-sysupgrade
          path: output/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ponwrt-nokia-xg-040g-md-ubi-build-diagnostics
          path: |
            source-revisions.txt
            single-device-config-check.txt
            download.log
            ponwrt-kmod-build-info.txt
            output/kmods/BUILD-INFO.txt
            output/kmods/SHA256SUMS
            output/BUILD-INFO.txt
            ponwrt-en7572-firmware-integration.txt
            ponwrt-kmod-build.log
            build.log
          if-no-files-found: ignore
          retention-days: 14
 package/feeds/pon_drivers/airoha-pon-frontends/Makefile
            for target in "${!package_targets[@]}"; do
              make "$target" -j"$(nproc)" V=s 2>&1 | tee -a ponwrt-kmod-build.log
            done
            test "$(sha256sum .config | awk '{print $1}')" = "$firmware_config_sha" || {
              echo 'Supplementary kmod build changed the original firmware .config' >&2
              exit 1
            }

            for package in "${standalone_kmods[@]}"; do
              mapfile -t matches < <(find bin/packages -type f -name "${package}_*.apk" -print)
              if [ "${#matches[@]}" -ne 1 ] || [ ! -s "${matches[0]:-}" ]; then
                printf 'Expected exactly one non-empty PonWrt-built APK for %s; found %s\n' "$package" "${#matches[@]}" >&2
                printf '%s\n' "${matches[@]}" >&2
                exit 1
              fi
              install -m 0644 "${matches[0]}" "output/kmods/$(basename "${matches[0]}")"
            done
          else
            echo 'No required standalone PonWrt kmods; all required Airoha PON kmods are firmware-integrated.'
          fi

          (cd output/kmods && find . -maxdepth 1 -type f -name '*.apk' -print0 | sort -z | xargs -0 -r sha256sum) > output/kmods/SHA256SUMS

          {
            echo "Repository: ${GITHUB_REPOSITORY}"
            echo "Commit: ${GITHUB_SHA}"
            echo 'Firmware-integrated PonWrt kmods:'
            printf '%s\n' "${firmware_kmods[@]}"
            echo
            echo 'Standalone PonWrt kmod APKs:'
            cat output/kmods/SHA256SUMS
          } > output/kmods/BUILD-INFO.txt

      - name: Verify and stage firmware and Bootloader artifacts
        shell: bash
        run: |
          set -euo pipefail
          image_dir='bin/targets/airoha/an7581'
          test -d "$image_dir"

          find_one() {
            local pattern="$1" description="$2"
            local -a matches=()
            mapfile -t matches < <(find "$image_dir" -maxdepth 1 -type f -name "$pattern" -print)
            if [ "${#matches[@]}" -ne 1 ]; then
              printf 'Expected exactly one %s (%s), found %s\n' "$description" "$pattern" "${#matches[@]}" >&2
              printf '%s\n' "${matches[@]}" >&2
              exit 1
            fi
            if [ ! -s "${matches[0]}" ]; then
              printf '%s is missing or empty: %s\n' "$description" "${matches[0]}" >&2
              exit 1
            fi
            printf '%s\n' "${matches[0]}"
          }

          sysupgrade="$(find_one '*sysupgrade.itb' 'sysupgrade image')"
          # ARTIFACT outputs are prefixed by DEVICE_IMG_PREFIX in OpenWrt.
          preloader="$(find_one '*-preloader.bin' 'Nokia Preloader artifact')"
          fip="$(find_one '*-bl31-uboot.fip' 'Nokia BL31/U-Boot FIP artifact')"

          # The Nokia U-Boot variant must retain the Airoha hardware RNG driver.
          mapfile -t uboot_configs < <(find build_dir -type f -path '*/u-boot-*/.config' -print)
          if [ "${#uboot_configs[@]}" -ne 1 ]; then
            printf 'Expected exactly one configured U-Boot build tree, found %s\n' "${#uboot_configs[@]}" >&2
            printf '%s\n' "${uboot_configs[@]}" >&2
            exit 1
          fi
          grep -qx 'CONFIG_DM_RNG=y' "${uboot_configs[0]}"
          grep -qx 'CONFIG_RNG_AIROHA=y' "${uboot_configs[0]}"

          mkdir -p output
          install -m 0644 "$sysupgrade" output/nokia_xg-040g-md-ubi-sysupgrade.itb
          install -m 0644 "$fip" output/bl31-uboot.fip
          install -m 0644 "$preloader" output/preloader.bin

          for artifact in \
            output/nokia_xg-040g-md-ubi-sysupgrade.itb \
            output/bl31-uboot.fip \
            output/preloader.bin; do
            test -s "$artifact"
          done

          sha256sum \
            output/nokia_xg-040g-md-ubi-sysupgrade.itb \
            output/bl31-uboot.fip \
            output/preloader.bin > output/SHA256SUMS
          find output/kmods -maxdepth 1 -type f -name '*.apk' -print0 | sort -z | xargs -0 -r sha256sum >> output/SHA256SUMS

          {
            echo "Repository: ${GITHUB_REPOSITORY}"
            echo "Commit: ${GITHUB_SHA}"
            echo 'Target: airoha/an7581'
            echo 'Device: nokia_xg-040g-md-ubi'
            echo 'DTS: an7581-nokia_xg-040g-md-ubi'
            echo "Built at (UTC): $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo
            echo 'Source revisions:'
            cat source-revisions.txt
            echo
            echo 'Artifact SHA256:'
            cat output/SHA256SUMS
            echo
            echo 'EN7572 firmware integration verification:'
            cat ponwrt-en7572-firmware-integration.txt
            echo
            echo 'U-Boot RNG build configuration:'
            printf 'U-Boot config: %s\n' "${uboot_configs[0]}"
            grep -E '^CONFIG_(DM_RNG|RNG_AIROHA)=y$' "${uboot_configs[0]}"
            echo 'Note: this proves the hardware RNG driver is enabled in the built U-Boot configuration; actual entropy/seed delivery requires device-side runtime verification.'
            echo
            echo 'Supplementary PonWrt kmods:'
            cat output/kmods/SHA256SUMS
          } > output/BUILD-INFO.txt

      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ponwrt-nokia-xg-040g-md-ubi-sysupgrade
          path: output/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ponwrt-nokia-xg-040g-md-ubi-build-diagnostics
          path: |
            source-revisions.txt
            single-device-config-check.txt
            download.log
            atf-build.log
            ponwrt-kmod-build-info.txt
            ponwrt-en7572-firmware-integration.txt
            output/kmods/BUILD-INFO.txt
            output/kmods/SHA256SUMS
            output/BUILD-INFO.txt
            ponwrt-en7572-firmware-integration.txt
            ponwrt-kmod-build.log
            build.log
          if-no-files-found: ignore
          retention-days: 14
